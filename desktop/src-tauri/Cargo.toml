[package]
name = "desktop"
version = "2.5.11"
description = "Arca desktop adapter for the shared MCP, Model, Skill, and Agent core"
authors = ["Scoheart"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.3"
chrono = "0.4"
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Tauri updater owns the reqwest client; feature unification enables SOCKS
# proxy URLs for its check and download resource without a parallel client.
reqwest = { version = "0.13", default-features = false, features = ["socks"] }
ureq = "3"
libc = "0.2"
arca-core = { path = "../../core" }
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSView", "NSWindow", "NSResponder"] }

# Tuned for CI build time (and a smaller dmg). Runtime perf is irrelevant for a
# config-manager GUI, so we trade a little optimization for faster compiles.
[profile.release]
codegen-units = 256   # more parallel codegen → faster compile
opt-level = 2         # 2 vs 3 is imperceptible here, compiles quicker
strip = true          # strip symbols → smaller binary, no separate strip step
