# Preserve this profile comment and unrelated expression verbatim.
- insert:
    - id: unrelated-plugin
      name: '@fixture/unrelated'
      config:
        location: !!js dshHomePath('unrelated')
- id: mcp-manager
  config:
    futureManagerPolicy: {keep: true}
    servers:
      paused:
        transport: stdio
        command: fixture-command # keep command comment
        args: [original]
        enabled: false # native pause
        startupTimeoutMs: 42000
        reconnect: {initialDelayMs: 1234}
        futureServerPolicy: {keep: true}
      sibling:
        transport: streamable-http
        url: https://example.test/sibling
        headers: {Authorization: 'Bearer ${credential:FIXTURE_REFERENCE}'}
        enabled: true
- id: llm-pi-ai
  config:
    providers:
      external:
        models:
          - id: external-model # keep model comment
            contextWindow: 12000
            policy: {keep: true}
