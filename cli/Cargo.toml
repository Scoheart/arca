[package]
name = "arca-cli"
version = "2.36.0"
edition = "2021"
description = "CLI and TUI for the Arca central Agent resource manager"

[[bin]]
name = "arca"
path = "src/main.rs"

[dependencies]
arca-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
crossterm = "0.29"
fuzzy-matcher = "0.3"
serde_json = "1"
